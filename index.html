<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Section With Dropdown Navigation</title>
    <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <main>
            <header class="header">
                <div class="header-logo">
                    <img src="./images/logo.svg" alt="Snap">
                </div>
                <div class="menu-overlay"></div>
                <nav class="menu">
                    <ul class="menu-list">
                        <li class="menu-item">
                            <a href="#" class="menu-link link-dropdown">
                                <p class="dropdown-text">Features</p>
                                <img src="./images/icon-arrow-down.svg" alt="">
                            </a>
                        </li>
                        <li class="menu-item">
                            <a href="#" class="menu-link link-dropdown">
                                <p class="dropdown-text">Company</p>
                                <img src="./images/icon-arrow-down.svg" alt="">
                            </a>
                        </li>
                        <li class="menu-item">
                            <a href="#" class="menu-link">Careers</a>
                        </li>
                        <li class="menu-item">
                            <a href="#" class="menu-link">About</a>
                        </li>
                    </ul>

                    <div class="menu-buttons">
                        <a href="#" class="button-menu_login">Login</a>
                        <a href="#" class="button-menu_register">Register</a>
                    </div>
                </nav>
                
                <button class="burger">
                    <span></span>
                </button>
            </header>
        </main>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>

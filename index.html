<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Section With Dropdown Navigation</title>
    <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <main>
            <header class="header">
                <div class="header-logo">
                    <img src="./images/logo.svg" alt="Snap">
                </div>
                <div class="menu-overlay"></div>
                <nav class="menu" id="main-menu">
                    <ul class="menu-list">
                        <li class="menu-item">
                            <button
                                class="menu-link link-dropdown_features"
                                aria-expanded="false"
                                aria-controls="features-menu"
                            >
                                <span class="menu-link">Features</span>
                                <img src="./images/icon-arrow-down.svg" alt="">
                            </button>
                            <ul class="features-dropdown_menu" id="features-menu">
                                <li class="dropdown-features_item">
                                    <a href="#" class="dropdown-features_link">
                                        <div class="dropdown-features_img">
                                            <img src="./images/icon-todo.svg" alt="">
                                        </div>
                                        <p class="dropdown-features_text">ToDo List</p>
                                    </a>
                                </li>
                                <li class="dropdown-features_item">
                                    <a href="#" class="dropdown-features_link">
                                       <div class="dropdown-features_img">
                                            <img src="./images/icon-calendar.svg" alt="">
                                        </div>
                                        <p class="dropdown-features_text">Calendar</p>
                                    </a>
                                </li>
                                <li class="dropdown-features_item">
                                    <a href="#" class="dropdown-features_link">
                                        <div class="dropdown-features_img">
                                            <img src="./images/icon-reminders.svg" alt="">
                                        </div>
                                        <p class="dropdown-features_text">Reminder</p>
                                    </a>
                                </li>
                                <li class="dropdown-features_item">
                                    <a href="#" class="dropdown-features_link">
                                        <div class="dropdown-features_img">
                                            <img src="./images/icon-planning.svg" alt="">
                                        </div>
                                        <p class="dropdown-features_text">Planing</p>
                                    </a>
                                </li>
                            </ul>
                        </li>
                        <li class="menu-item">
                            <button
                                class="menu-link link-dropdown_company"
                                aria-expanded="false"
                                aria-controls="company-menu"
                            >
                                <span class="menu-link">Company</span>
                                <img src="./images/icon-arrow-down.svg" alt="">
                            </button>
                            
                            <ul class="company-dropdown_menu" id="company-menu">
                                <li class="dropdown-company_item">
                                    <a href="#" class="dropdown-company_link">History</a>
                                </li>
                                <li class="dropdown-company_item">
                                    <a href="#" class="dropdown-company_link">Our Team</a>
                                </li>
                                <li class="dropdown-company_item">
                                    <a href="#" class="dropdown-company_link">Blog</a>
                                </li>
                            </ul>
                        </li>
                        <li class="menu-item">
                            <a href="#" class="menu-link">Careers</a>
                        </li>
                        <li class="menu-item">
                            <a href="#" class="menu-link">About</a>
                        </li>
                    </ul>

                    <div class="menu-buttons">
                        <a href="#" class="button-menu_login">Login</a>
                        <a href="#" class="button-menu_register">Register</a>
                    </div>
                </nav>
                
                <button
                    class="burger"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="main-menu"
                >
                    <span></span>
                </button>
            </header>
            <section class="hero container">
                <div class="hero-content">
                    <div class="content-hero_block">
                        <h1 class="block-hero_title">Make remote work</h1>
                        <p class="block-hero_text">Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
                        <button class="block-hero_button">Learn more</button>
                    </div>
                    <div class="content-hero_clients">
                        <div class="clients-hero_img">
                            <img src="./images/client-databiz.svg" alt="Databiz">
                        </div>
                        <div class="clients-hero_img">
                            <img src="./images/client-audiophile.svg" alt="Audiophile">
                        </div>
                        <div class="clients-hero_img">
                            <img src="./images/client-meet.svg" alt="Meet">
                        </div>
                        <div class="clients-hero_img">
                            <img src="./images/client-maker.svg" alt="Maker">
                        </div>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="./images/image-hero-desktop.png" alt="Illustration">
                </div>
            </section>
        </main>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
